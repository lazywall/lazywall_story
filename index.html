<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>As We Remember It</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: season rail on the left, hero + episode row on the right, full-screen episode page on top. Neon-night palette taken from the series' own cards. */
:root{
  --bg:#0b0912; --panel:#14111f; --panel2:#1b1729; --line:#2b2540;
  --fg:#f4f1ff; --muted:#a9a2c4; --cyan:#3cf0ff; --mag:#ff46e6;
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --num:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--font);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
.app{display:grid;grid-template-columns:292px minmax(0,1fr);gap:32px;max-width:1500px;margin:0 auto;padding-block:24px 56px}

/* rail */
.rail{position:sticky;top:24px;align-self:start;display:flex;flex-direction:column;gap:22px;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--cyan)}
.brand span{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.seasons{display:flex;flex-direction:column;gap:12px;min-width:0}
.season{position:relative;display:block;width:100%;height:118px;border-radius:12px;overflow:hidden;text-align:left;border:2px solid transparent;background:var(--panel);transition:border-color .2s,transform .2s}
.season img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.62) saturate(1.05);transition:filter .25s}
.season::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,9,18,.88),rgba(11,9,18,.05) 80%)}
.season .tx{position:absolute;z-index:1;left:14px;bottom:12px;right:14px;display:flex;flex-direction:column;gap:1px}
.season .k{font:600 12px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.season .n{font:700 20px/1.2 var(--font)}
.season .c{font-size:12px;color:var(--muted)}
.season:hover img,.season[aria-pressed=true] img{filter:brightness(.9)}
.season[aria-pressed=true]{border-color:var(--cyan)}
.lang{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.1em}
.lang button{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed=true]{border-color:var(--cyan);color:var(--fg)}
.foot{color:var(--muted);font-size:12px;line-height:1.5}

/* hero */
main{min-width:0;display:flex;flex-direction:column;gap:30px}
.hero{position:relative;border-radius:18px;overflow:hidden;background:var(--panel);isolation:isolate}
.hero .bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(34px) brightness(.38) saturate(1.3);z-index:-2}
.hero .in{display:flex;gap:36px;align-items:center;justify-content:space-between;padding:34px 40px;min-width:0}
.hero .txt{display:flex;flex-direction:column;gap:14px;max-width:560px;min-width:0}
.eyebrow{font:600 12px/1 var(--font);letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}
.hero h1{margin:0;font:800 clamp(34px,4.6vw,56px)/1.02 var(--font);letter-spacing:-.01em;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;letter-spacing:.04em}
.hero p{margin:0;font-size:16px;line-height:1.6;max-width:52ch;color:#e4dffa}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);background:rgba(255,255,255,.06);transition:background .2s,transform .2s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.pri{background:var(--cyan);color:#06121a;border-color:var(--cyan)}
.btn.pri:hover{background:#7af5ff}
.btn[aria-disabled=true]{opacity:.5;cursor:default;pointer-events:none}
.frame{flex:none;height:clamp(300px,34vw,420px);aspect-ratio:9/16;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.12)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}

/* episodes row */
.rowhead{display:flex;align-items:end;justify-content:space-between;gap:16px}
.rowhead h2{margin:0;font:700 22px/1.2 var(--font)}
.arrows{display:flex;gap:8px}
.arrows button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:18px;line-height:1;display:grid;place-items:center}
.arrows button:hover{border-color:var(--cyan)}
.row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x proximity;padding:6px 2px 16px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card{flex:none;width:176px;scroll-snap-align:start;display:flex;flex-direction:column;gap:10px;text-align:left}
.thumb.locked img{filter:brightness(.5) saturate(.7)}
.thumb.locked .lab{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:600 11px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan);text-shadow:0 1px 6px #000}
.player.locked img{filter:brightness(.55) saturate(.7)}
.thumb{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transition:transform .25s,border-color .25s,box-shadow .25s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .thumb{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 14px 34px rgba(60,240,255,.16)}
.badge{position:absolute;left:8px;top:8px;padding:3px 9px;border-radius:999px;background:rgba(11,9,18,.78);font:700 12px/1.4 var(--num);letter-spacing:.1em;text-transform:uppercase;backdrop-filter:blur(4px)}
.card .t{font-weight:600;font-size:14px;line-height:1.3;text-wrap:balance}
.card .p{color:var(--muted);font-size:12px;line-height:1.35}
.thumb.soon{display:grid;place-items:center;background:
  radial-gradient(120% 70% at 20% 0%,rgba(255,70,230,.35),transparent 60%),
  radial-gradient(120% 70% at 90% 100%,rgba(60,240,255,.28),transparent 60%),#141026}
.thumb.soon .big{font:700 92px/1 var(--num);color:rgba(255,255,255,.9);letter-spacing:.02em}
.thumb.soon .lab{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:600 11px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}

/* episode page */
.detail{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.detail .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.close{padding:9px 16px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:13px}
.close:hover{border-color:var(--cyan)}
.ep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:44px;align-items:center}
.player{position:relative;height:min(68vh,640px);aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:0 22px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.12);display:block}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.player .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:rgba(11,9,18,.72);border:2px solid var(--cyan);display:grid;place-items:center;transition:transform .2s,background .2s}
.player:hover .play{transform:scale(1.08);background:rgba(60,240,255,.22)}
.play svg{width:34px;height:34px;margin-left:4px;fill:var(--cyan)}
.player.soon{display:grid;place-items:center;background:radial-gradient(120% 70% at 20% 0%,rgba(255,70,230,.35),transparent 60%),radial-gradient(120% 70% at 90% 100%,rgba(60,240,255,.28),transparent 60%),#141026}
.player.soon .big{font:700 140px/1 var(--num)}
.info{display:flex;flex-direction:column;gap:16px;min-width:0}
.info h2{margin:0;font:800 clamp(30px,4vw,48px)/1.05 var(--font);text-wrap:balance}
.info .syn{margin:0;font-size:16px;line-height:1.65;color:#e4dffa;max-width:54ch}
.note{font-size:13px;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.nb{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;min-width:0;transition:border-color .2s,background .2s}
.nb:hover:not([disabled]){border-color:var(--cyan);background:var(--panel2)}
.nb[disabled]{opacity:.35;cursor:default}
.nb small{font:600 11px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.nb span{font-weight:600;font-size:14px;line-height:1.3}
.nb.next{text-align:right;align-items:flex-end}
.upnext h3{margin:0 0 12px;font:700 16px/1.2 var(--font)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:22px;padding-block:16px 40px}
  .rail{position:static;gap:14px}
  .seasons{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .season{flex:none;width:210px;height:96px}
  .foot{display:none}
  .hero .in{flex-direction:column-reverse;align-items:flex-start;padding:22px 20px;gap:22px}
  .frame{height:230px}
  .ep{grid-template-columns:minmax(0,1fr);gap:22px;justify-items:center}
  .player{height:min(58vh,520px)}
  .info{width:100%}
  .nav{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app" id="app">
  <aside class="rail">
    <div class="brand"><b>As We <i>Remember</i> It</b><span id="tag"></span></div>
    <nav class="seasons" id="seasons" aria-label="Seasons"></nav>
    <div class="foot" id="foot"></div>
  </aside>
  <main>
    <section class="hero" id="hero"></section>
    <section>
      <div class="rowhead"><h2 id="rh"></h2><div class="arrows"><button type="button" id="al" aria-label="Previous">‹</button><button type="button" id="ar" aria-label="Next">›</button></div></div>
      <div class="row" id="row"></div>
    </section>
  </main>
</div>
<section class="detail" id="detail" hidden aria-label="Episode"></section>

/* YouTube links: put the full URL (watch, youtu.be or shorts) or just the video id, in the order of the episodes. */
const YT = {
  1:['','','','','','','','']
};
const UI = {
  en:{tag:"Lazywall's story, as we remember it", season:'Season', eps:'episodes', ep:'Episode', episodes:'Episodes', play1:'Play episode 1', watch:'Watch on YouTube', nolink:'YouTube link coming soon',
      prev:'Previous', next:'Next', close:'Close', soon:'Coming soon', upnext:'Up next', foot:'An animated series by Lazywall, told from memory. Episodes open on YouTube.', hint:'Opens YouTube in a new tab.', first:'First episode', last:'Latest episode', avail:'Available', at:'at', tz:'Morocco time', locale:'en-GB'},
  fr:{tag:"L'histoire de Lazywall, telle qu'on s'en souvient", season:'Saison', eps:'épisodes', ep:'Épisode', episodes:'Épisodes', play1:"Lire l'épisode 1", watch:'Regarder sur YouTube', nolink:'Lien YouTube bientôt',
      prev:'Précédent', next:'Suivant', close:'Fermer', soon:'Bientôt', upnext:'À suivre', foot:"Une série animée de Lazywall, racontée de mémoire. Les épisodes s'ouvrent sur YouTube.", hint:'Ouvre YouTube dans un nouvel onglet.', first:'Premier épisode', last:'Dernier épisode', avail:'Disponible le', at:'à', tz:'heure du Maroc', locale:'fr-FR'}
};
const ALL = []; SEASONS.forEach((s,si)=>s.eps.forEach((e,ei)=>{ALL.push({s:si,e:ei,ep:e,season:s});}));
const $ = id => document.getElementById(id);
let lang = 'en', cur = 0, open = -1;
function ytUrl(v){ if(!v) return ''; return /^https?:/.test(v) ? v : 'https://www.youtube.com/watch?v='+v; }
function link(si,ei){ return ytUrl((YT[SEASONS[si].n]||[])[ei]); }
function pad(n){ return String(n).padStart(2,'0'); }
function tr(o){ return typeof o==='string'?o:(o[lang]||o.en); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }


function isOut(e){ if(e.soon) return false; return !e.rel || Date.now() >= Date.parse(e.rel); }
function fmtDay(e,long){ return new Date(e.rel.slice(0,10)+'T12:00:00Z').toLocaleDateString(UI[lang].locale,{day:'numeric',month:long?'long':'short',timeZone:'UTC'}); }
function fmtHour(e){ const h = +e.rel.slice(11,13); return lang==='fr' ? h+' h' : (h%12||12)+(h<12?' AM':' PM'); }
function whenShort(e){ return e.rel ? fmtDay(e,false)+' · '+fmtHour(e) : UI[lang].soon; }
function whenLong(e){ return e.rel ? UI[lang].avail+' '+fmtDay(e,true)+' '+UI[lang].at+' '+fmtHour(e)+' ('+UI[lang].tz+')' : UI[lang].soon; }
function nOut(){ return ALL.filter(x=>isOut(x.ep)).length; }

function renderRail(){
  $('tag').textContent = UI[lang].tag;
  $('foot').textContent = UI[lang].foot;
  $('seasons').innerHTML = SEASONS.map((s,i)=>`
    <button type="button" class="season" data-s="${i}" aria-pressed="${i===cur}">
      <img src="${IMG[s.img]}" alt="" style="object-position:${s.pos}">
      <span class="tx"><span class="k">${UI[lang].season} ${s.n}</span><span class="n">${esc(tr(s.name))}</span><span class="c">${s.years} · ${s.eps.length} ${UI[lang].eps}</span></span>
    </button>`).join('');
}
function renderHero(){
  const s = SEASONS[cur], first = link(cur,0);
  $('hero').innerHTML = `
    <img class="bg" src="${IMG[s.img]}" alt="">
    <div class="in">
      <div class="txt">
        <span class="eyebrow">${UI[lang].season} ${s.n}</span>
        <h1>${esc(tr(s.name))}</h1>
        <span class="meta">${s.years} · ${s.eps.length} ${UI[lang].eps}</span>
        <p>${esc(tr(s.blurb))}</p>
        <div class="btns"><button type="button" class="btn pri" id="play1">▶ ${UI[lang].play1}</button></div>
      </div>
      <div class="frame"><img src="${IMG[s.img]}" alt=""></div>
    </div>`;
  $('play1').onclick = () => openEp(flat(cur,0));
}
function renderRow(){
  const s = SEASONS[cur];
  $('rh').textContent = UI[lang].episodes;
  $('row').innerHTML = s.eps.map((e,i)=>{
    const out = isOut(e);
    const art = (e.soon||!IMG[e.th])
      ? `<div class="thumb soon"><span class="badge">EP ${pad(i+1)}</span><span class="big">${pad(i+1)}</span><span class="lab">${whenShort(e)}</span></div>`
      : `<div class="thumb${out?'':' locked'}"><span class="badge">EP ${pad(i+1)}</span><img src="${IMG[e.th]}" alt="" loading="lazy">${out?'':`<span class="lab">${whenShort(e)}</span>`}</div>`;
    return `<button type="button" class="card" data-e="${i}">${art}<span class="t">${esc(e.t)}</span><span class="p">${esc(tr(e.place))}</span></button>`;
  }).join('');
}
function flat(si,ei){ return ALL.findIndex(x=>x.s===si&&x.e===ei); }
function renderDetail(){
  const x = ALL[open], e = x.ep, u = link(x.s,x.e);
  const prev = ALL[open-1], next = ALL[open+1];
  const out = isOut(e);
  const art = (e.soon||!IMG[e.th])
    ? `<div class="player soon"><span class="big">${pad(x.e+1)}</span></div>`
    : (u && out
      ? `<a class="player" href="${u}" target="_blank" rel="noopener" aria-label="${UI[lang].watch}"><img src="${IMG[e.th]}" alt=""><span class="play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span></a>`
      : `<div class="player${out?'':' locked'}"><img src="${IMG[e.th]}" alt=""></div>`);
  const btn = !out
    ? `<span class="btn" aria-disabled="true">${whenLong(e)}</span>`
    : (u ? `<a class="btn pri" href="${u}" target="_blank" rel="noopener">▶ ${UI[lang].watch}</a>` : `<span class="btn" aria-disabled="true">${UI[lang].nolink}</span>`);
  const nb = (it,dir)=> it
    ? `<button type="button" class="nb ${dir}" data-go="${dir==='next'?open+1:open-1}"><small>${dir==='next'?UI[lang].next+' →':'← '+UI[lang].prev}</small><span>${it.season.n===1?'S1':'S2'} · EP ${pad(it.e+1)} — ${esc(it.ep.t)}</span></button>`
    : `<button type="button" class="nb ${dir}" disabled><small>${dir==='next'?UI[lang].next+' →':'← '+UI[lang].prev}</small><span>${dir==='next'?UI[lang].last:UI[lang].first}</span></button>`;
  $('detail').innerHTML = `
    <div class="wrap">
      <div class="top"><span class="eyebrow">${UI[lang].season} ${x.season.n} · ${esc(tr(x.season.name))}</span><button type="button" class="close" id="close">✕ ${UI[lang].close}</button></div>
      <div class="ep">
        ${art}
        <div class="info">
          <span class="eyebrow">${UI[lang].ep} ${x.e+1}${tr(e.place)?' · '+esc(tr(e.place)):''}</span>
          <h2>${esc(e.t)}</h2>
          <p class="syn">${esc(tr(e.syn))}</p>
          <div class="btns">${btn}</div>
          ${(out&&u)?`<span class="note">${UI[lang].hint}</span>`:''}
          <div class="nav">${nb(prev,'prev')}${nb(next,'next')}</div>
        </div>
      </div>
    </div>`;
  $('close').onclick = closeEp;
  $('detail').scrollTop = 0;
}
function openEp(i){
  if(i<0||i>=ALL.length) return;
  open = i;
  if(cur!==ALL[i].s){ cur = ALL[i].s; renderRail(); renderHero(); renderRow(); }
  renderDetail();
  $('detail').hidden = false; $('app').inert = true;
  document.body.style.overflow = 'hidden';
  const c = $('close'); if(c) c.focus({preventScroll:true});
}
function closeEp(){
  const x = ALL[open]; open = -1;
  $('detail').hidden = true; $('app').inert = false; document.body.style.overflow = '';
  const card = document.querySelector(`.card[data-e="${x?x.e:0}"]`); if(card) card.focus({preventScroll:true});
}
function renderAll(){ renderRail(); renderHero(); renderRow(); if(open>=0) renderDetail(); }

document.addEventListener('click',ev=>{
  const t = ev.target.closest('[data-s],[data-e],[data-go]');
  if(!t) return;
  if(t.dataset.s!==undefined){ cur = +t.dataset.s; renderRail(); renderHero(); renderRow(); }
  else if(t.dataset.e!==undefined){ openEp(flat(cur,+t.dataset.e)); }
  else if(t.dataset.go!==undefined){ openEp(+t.dataset.go); }
});
document.addEventListener('keydown',ev=>{
  if(open<0) return;
  if(ev.key==='Escape') closeEp();
  else if(ev.key==='ArrowRight') openEp(open+1);
  else if(ev.key==='ArrowLeft') openEp(open-1);
});
$('al').onclick = ()=>$('row').scrollBy({left:-540,behavior:'smooth'});
$('ar').onclick = ()=>$('row').scrollBy({left:540,behavior:'smooth'});
document.documentElement.lang = lang;
renderAll();
let shown = nOut();
setInterval(()=>{ const n = nOut(); if(n!==shown){ shown=n; renderAll(); } },30000);
const m = /^#s(\d)e(\d+)$/.exec(location.hash);
if(m){ const si=+m[1]-1, ei=+m[2]-1; if(SEASONS[si]&&SEASONS[si].eps[ei]){ cur=si; renderAll(); openEp(flat(si,ei)); } }
</script>
